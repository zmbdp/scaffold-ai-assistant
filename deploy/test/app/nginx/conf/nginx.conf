worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections  10000;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    upstream zmbdpgateway {
        server zmbdp-service-zmbdp-gateway-1:10030;
        keepalive 1000;
    }

    # ==========================================
    # C端：80端口
    # ==========================================
    server {
        listen       80;
        server_name  "";
        client_max_body_size 100M;

        location / {
            root   /data/scaffold-ai-assistant/web/dist-c;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;

            add_header 'Access-Control-Allow-Origin' *;
            add_header 'Access-Control-Allow-Headers' *;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' *;
        }

        location ~* ^\/(admin\/|file\/|portal\/|chat\/) {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control no-store;
            add_header Pragma  no-cache;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://zmbdpgateway;
            proxy_connect_timeout    300s;
            proxy_read_timeout       300s;
            proxy_send_timeout       300s;
        }
    }

    # ==========================================
    # B端：81端口
    # ==========================================
    server {
        listen       81;
        server_name  "";
        client_max_body_size 100M;

        location / {
            root   /data/scaffold-ai-assistant/web/dist-b;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;

            add_header 'Access-Control-Allow-Origin' *;
            add_header 'Access-Control-Allow-Headers' *;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' *;
        }

        location ~* ^\/(admin\/|file\/|portal\/|chat\/) {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control no-store;
            add_header Pragma  no-cache;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://zmbdpgateway;
            proxy_connect_timeout    300s;
            proxy_read_timeout       300s;
            proxy_send_timeout       300s;
        }
    }
}